name: Validate starter

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify Claude skill adapters
        run: node .agents/scripts/sync-claude-skill-adapters.mjs --check
      - name: Verify knowledge index
        run: node .agents/skills/record-decision/scripts/update-index.mjs --check
      - name: Run tests
        run: node --test tests/knowledge-hooks.test.mjs tests/knowledge-index.test.mjs tests/skill-integration.test.mjs
